name: Workflow for Codecov python
# 只在 PR 上跑（全部后端 + 上传覆盖率）。直接 push 不跑：分支开了 PR 后，push 和 pull_request
# 会各触发一次，push 那次只是重复
on:
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

concurrency:
  # github.ref = refs/pull/<PR 号>/merge
  # github.workflow = top-level workflow name
  group: ${{ github.workflow }}-${{ github.ref }} # 同一个 PR 只同时运行一个，新推送取消旧的
  cancel-in-progress: true

jobs:
  run:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e .
      - name: Install pytest
        run: pip install --group dev
      - name: Run tests and collect coverage
        run: |
          PWD=$(pwd)
          export PYTHONPATH=$PWD/:$PYTHONPATH
          echo "PYTHONPATH=$PYTHONPATH"
          mkdir -p ./logs
          pytest -n 4 --cov-config=.coveragerc --cov=hetu tests/ ${{ env.CODECOV_ATS_TESTS }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          verbose: true
          flags: pytest
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  api-docs-drift:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install -e .
          pip install --group dev
      - name: Regenerate API docs
        run: python scripts/gen_api_docs.py
      - name: Fail if docs/api/ has drifted
        run: |
          if ! git diff --exit-code -- docs/api/; then
            echo ""
            echo "::error::docs/api/ is out of date. Run:"
            echo "::error::    uv run python scripts/gen_api_docs.py"
            echo "::error::then commit the result."
            exit 1
          fi
