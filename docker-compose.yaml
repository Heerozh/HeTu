# 组合Redis和Hetu
services:
  database:
    image: redis:latest
    ports:
      - "6379:6379"
    env_file:
      # 有就读（比如给配置文件里的 ${AUTH_KEY} 之类插值），没有也能起
      - path: .env
        required: false
    volumes:
      - ./data:/data
    restart: always

  application:
    build:
      dockerfile: Dockerfile
    # 关服时要排空连接、跑断线 System、释放租约，docker 默认只等 10 秒就强杀（见运维文档的"停服"）
    stop_grace_period: 70s
    ports:
      - "2466:2466"
    env_file:
      # 有就读（比如给配置文件里的 ${AUTH_KEY} 之类插值），没有也能起
      - path: .env
        required: false
    volumes:
      - ./app:/app
    depends_on:
      - database
    restart: always