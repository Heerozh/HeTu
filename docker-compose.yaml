# 组合Redis和Hetu
services:
  database:
    image: redis:latest
    ports:
      - "6379:6379"
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: always

  application:
    build:
      dockerfile: Dockerfile
    # 关服时要排空连接、跑断线 System、释放租约，docker 默认只等 10 秒就强杀（见运维文档的"停服"）
    stop_grace_period: 70s
    ports:
      - "2466:2466"
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      - redis
    restart: always